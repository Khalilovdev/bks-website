<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Rejim birinchi renderdan oldin o'rnatiladi — «flash» bo'lmasligi uchun -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("bks-theme");
          document.documentElement.dataset.theme =
            saved === "light" || saved === "dark"
              ? saved
              : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        } catch (e) { document.documentElement.dataset.theme = "dark"; }
      })();
    </script>
    <style>
      html { background: #0e0e0e; }
      html[data-theme="light"] { background: #f6f4ef; }
    </style>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230e0e0e'/%3E%3Ctext x='32' y='45' font-family='Arial,sans-serif' font-size='38' font-weight='900' fill='%23f5a623' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E" />
    <title>Beton Klass Savdo — Sement va beton mahsulotlari | Samarqand</title>
    <meta name="description" content="Sement, tayyor beton, beton buyumlar va inert materiallar — Samarqandda. Hajm kalkulyatori, Telegram orqali tezkor buyurtma." />
    <!-- OG teglar — deploy'dan keyin real URL bilan to'ldiriladi -->
    <meta property="og:title" content="Beton Klass Savdo" />
    <meta property="og:description" content="Sement va beton mahsulotlari — Samarqand" />
    <meta property="og:type" content="website" />
    <!-- Tailwind Play CDN — kichik landing uchun yetarli -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
